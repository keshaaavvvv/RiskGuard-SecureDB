{% extends "base.html" %}{% block content %}<div class="auth panel wide"><p class="eyebrow">RISK REGISTER</p><h1>New risk assessment</h1>{% if not students %}<p class="flash warning">Create a student profile first.</p>{% endif %}<form method="post" class="form-grid"><label>Student<select name="student_id" required>{% for s in students %}<option value="{{ s.id }}">{{ s.name }} — {{ s.reg_no }}</option>{% endfor %}</select></label><label>Risk title<input name="title" required maxlength="180"></label><label>Category<select name="category"><option>Cyber Security</option><option>Academic</option><option>Privacy</option><option>Financial</option><option>Operational</option><option>Technology</option><option>Attendance</option><option>Physical Safety</option><option>Other</option></select></label><label>Probability (1–5)<input type="number" name="probability" min="1" max="5" value="3" required></label><label>Impact (1–5)<input type="number" name="impact" min="1" max="5" value="3" required></label><label>Status<select name="status"><option>Open</option><option>In Progress</option><option>Closed</option></select></label><label>Risk owner<input name="owner"></label><label class="full">Description<textarea name="description" rows="3"></textarea></label><label class="full">Mitigation plan<textarea name="mitigation" rows="3"></textarea></label><div class="full"><button class="btn" {% if not students %}disabled{% endif %}>Save assessment</button></div></form><p class="muted">Score and severity are calculated server-side: probability × impact.</p></div>{% endblock %}
