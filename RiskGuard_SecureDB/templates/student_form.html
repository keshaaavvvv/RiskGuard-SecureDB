{% extends "base.html" %}{% block content %}<div class="auth panel wide"><p class="eyebrow">ADMINISTRATION</p><h1>Add student profile</h1><form method="post" class="form-grid"><label>Registration number<input name="reg_no" required></label><label>Full name<input name="name" required></label><label>Department<input name="department" required></label><label>Email<input name="email" type="email" required></label><label>Year<input name="year" value="3" required></label><label>Section<input name="section" value="A" required></label><label>Attendance %<input type="number" name="attendance" min="0" max="100" value="0" required></label><div><button class="btn">Save profile</button></div></form></div>{% endblock %}
